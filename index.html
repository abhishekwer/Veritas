<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Veritas OS</title>

  <!-- iOS Standalone Web App Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Veritas">
  <meta name="theme-color" content="#08090C">

  <!-- React, ReactDOM, Babel & Tailwind CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background-color: #08090C;
      color: #E2E8F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .safe-top { padding-top: env(safe-area-inset-top); }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
    .card-glass {
      background: rgba(18, 22, 34, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="safe-top safe-bottom select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- FSRS-5 MATHEMATICAL MEMORY ENGINE ---
    class FSRSEngine {
      static calculateRetrievability(stability, daysElapsed) {
        if (daysElapsed <= 0) return 1.0;
        return Math.pow(1 + (19 / 81) * (daysElapsed / stability), -0.5);
      }

      static calculateNextDueDate(stability, targetRetention = 0.90) {
        const factor = (Math.pow(targetRetention, -2) - 1) * (81 / 19);
        const days = Math.max(1, Math.round(stability * factor));
        const dueDate = new Date();
        dueDate.setDate(dueDate.getDate() + days);
        return { days, dueDate };
      }

      static processReview(card, grade) { // grade: 1 (Again), 2 (Hard), 3 (Good), 4 (Easy)
        let s = card.stability || 2.0;
        let d = card.difficulty || 5.0;

        // Difficulty update
        d = Math.min(Math.max(d - 0.5 * (grade - 3), 1), 10);

        // Stability update
        if (grade === 1) {
          s = Math.max(0.5, s * 0.4);
        } else if (grade === 2) {
          s = s * 1.2;
        } else if (grade === 3) {
          s = s * 2.2;
        } else if (grade === 4) {
          s = s * 3.5;
        }

        const { days, dueDate } = this.calculateNextDueDate(s);
        return {
          ...card,
          stability: Number(s.toFixed(2)),
          difficulty: Number(d.toFixed(2)),
          reps: (card.reps || 0) + 1,
          lapses: grade === 1 ? (card.lapses || 0) + 1 : (card.lapses || 0),
          lastReview: new Date().toISOString(),
          dueDate: dueDate.toISOString(),
          intervalDays: days
        };
      }
    }

    // --- INITIAL SEED CARDS ---
    const DEFAULT_CARDS = [
      {
        id: "1",
        front: "What primary ion influx triggers synaptic vesicle exocytosis at the terminal button?",
        back: "Calcium (Ca²⁺) via voltage-gated channels.",
        hint: "Divalent cation with atomic number 20",
        stability: 3.5,
        difficulty: 4.0,
        reps: 2,
        lapses: 0,
        lastReview: new Date().toISOString(),
        dueDate: new Date().toISOString()
      },
      {
        id: "2",
        front: "How does the FSRS-5 algorithm model memory retrievability decay?",
        back: "Power-law retrievability: R(t) = (1 + 19/81 * t/S)^(-0.5)",
        hint: "Uses Stability (S) and Elapsed Time (t)",
        stability: 6.0,
        difficulty: 3.0,
        reps: 4,
        lapses: 0,
        lastReview: new Date().toISOString(),
        dueDate: new Date().toISOString()
      }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState("review"); // review | calendar | ai | keys
      const [cards, setCards] = useState(() => {
        const saved = localStorage.getItem("veritas_cards");
        return saved ? JSON.parse(saved) : DEFAULT_CARDS;
      });
      const [keys, setKeys] = useState(() => {
        const saved = localStorage.getItem("veritas_keys");
        return saved ? JSON.parse(saved) : { openai: "", gemini: "", anthropic: "" };
      });

      // Study Mode State
      const [currentIndex, setCurrentIndex] = useState(0);
      const [showAnswer, setShowAnswer] = useState(false);
      const [showHint, setShowHint] = useState(false);

      // AI Generation State
      const [inputText, setInputText] = useState("");
      const [isGenerating, setIsGenerating] = useState(false);
      const [aiProvider, setAiProvider] = useState("openai");

      // Save to localStorage
      useEffect(() => {
        localStorage.setItem("veritas_cards", JSON.stringify(cards));
      }, [cards]);

      useEffect(() => {
        localStorage.setItem("veritas_keys", JSON.stringify(keys));
      }, [keys]);

      // Due cards filter
      const dueCards = useMemo(() => {
        const now = new Date();
        return cards.filter(c => new Date(c.dueDate) <= now);
      }, [cards]);

      const currentCard = dueCards[currentIndex] || null;

      // Handle Review Rating
      const handleGrade = (grade) => {
        if (!currentCard) return;
        const updated = FSRSEngine.processReview(currentCard, grade);
        setCards(cards.map(c => c.id === currentCard.id ? updated : c));
        setShowAnswer(false);
        setShowHint(false);
        if (currentIndex >= dueCards.length - 1) {
          setCurrentIndex(0);
        }
      };

      // Handle AI Ingestion
      const generateCardsFromAI = async () => {
        if (!inputText.trim()) return;
        setIsGenerating(true);

        const prompt = `Extract exactly 3 atomic active-recall flashcards from this text in valid JSON array format.
        Schema: [{"front": "Question", "back": "Direct Answer", "hint": "Short clue"}]
        Text: ${inputText}`;

        try {
          let rawJson = "";
          if (aiProvider === "openai" && keys.openai) {
            const res = await fetch("https://api.openai.com/v1/chat/completions", {
              method: "POST",
              headers: { "Authorization": `Bearer ${keys.openai}`, "Content-Type": "application/json" },
              body: JSON.stringify({
                model: "gpt-4o",
                messages: [{ role: "user", content: prompt }],
                temperature: 0.2
              })
            });
            const data = await res.json();
            rawJson = data.choices[0].message.content;
          } else if (aiProvider === "gemini" && keys.gemini) {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${keys.gemini}`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            const data = await res.json();
            rawJson = data.candidates[0].content.parts[0].text;
          } else {
            // Simulated response if key not entered yet
            alert("No working API key detected in Vault. Generating demo flashcards.");
            rawJson = JSON.stringify([
              { front: "Concept Extract from: " + inputText.slice(0, 30) + "...", back: "Automated test response.", hint: "Review source text." }
            ]);
          }

          const parsed = JSON.parse(rawJson.replace(/```json/g, "").replace(/```/g, "").trim());
          const newCards = parsed.map((item, idx) => ({
            id: Date.now() + "_" + idx,
            front: item.front,
            back: item.back,
            hint: item.hint || "",
            stability: 2.0,
            difficulty: 5.0,
            reps: 0,
            lapses: 0,
            lastReview: new Date().toISOString(),
            dueDate: new Date().toISOString()
          }));

          setCards([...newCards, ...cards]);
          setInputText("");
          setActiveTab("review");
          alert(`Created ${newCards.length} new flashcards!`);
        } catch (err) {
          alert("Error generating cards: " + err.message);
        } finally {
          setIsGenerating(false);
        }
      };

      // Calendar Future 7-day projection
      const calendarData = useMemo(() => {
        const days = [];
        for (let i = 0; i < 7; i++) {
          const d = new Date();
          d.setDate(d.getDate() + i);
          const dateStr = d.toISOString().split("T")[0];
          const count = cards.filter(c => c.dueDate.split("T")[0] === dateStr).length;
          days.push({
            name: i === 0 ? "Today" : d.toLocaleDateString("en-US", { weekday: "short" }),
            date: dateStr,
            count: count,
            minutes: Math.ceil((count * 30) / 60)
          });
        }
        return days;
      }, [cards]);

      return (
        <div className="flex flex-col h-screen max-w-md mx-auto justify-between p-4 bg-[#08090C]">
          
          {/* HEADER */}
          <div className="flex justify-between items-center pb-3 border-b border-gray-800">
            <div>
              <h1 className="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                VERITAS <span className="text-xs px-2 py-0.5 rounded-full bg-cyan-950 text-cyan-400 border border-cyan-800">FSRS-5</span>
              </h1>
              <p className="text-xs text-gray-400">Personal Cognitive Operating System</p>
            </div>
            <div className="text-right">
              <span className="text-xs font-mono text-cyan-400 bg-cyan-950/50 px-2.5 py-1 rounded-lg border border-cyan-800/60">
                {dueCards.length} Due Today
              </span>
            </div>
          </div>

          {/* MAIN WORKSPACE CONTENT */}
          <div className="flex-1 overflow-y-auto py-4">

            {/* TAB 1: REVIEW STUDIO */}
            {activeTab === "review" && (
              <div className="h-full flex flex-col justify-between">
                {currentCard ? (
                  <div className="flex-1 flex flex-col justify-between">
                    <div className="card-glass p-6 rounded-2xl border border-gray-800 shadow-2xl relative min-h-[280px] flex flex-col justify-between">
                      <div>
                        <div className="flex justify-between items-center mb-4">
                          <span className="text-[10px] uppercase font-mono tracking-wider text-cyan-400">Active Recall Prompt</span>
                          <span className="text-[10px] font-mono text-gray-500">S: {currentCard.stability}d | D: {currentCard.difficulty}</span>
                        </div>
                        <h2 className="text-lg font-medium text-white leading-relaxed">{currentCard.front}</h2>
                        {showHint && currentCard.hint && (
                          <p className="mt-3 text-xs text-amber-300/90 bg-amber-950/30 p-2.5 rounded-lg border border-amber-800/40">
                            💡 Hint: {currentCard.hint}
                          </p>
                        )}
                      </div>

                      {showAnswer ? (
                        <div className="mt-6 pt-4 border-t border-gray-800">
                          <span className="text-[10px] uppercase font-mono tracking-wider text-emerald-400">Solution</span>
                          <p className="mt-1 text-base text-gray-100 font-medium">{currentCard.back}</p>
                        </div>
                      ) : (
                        <div className="flex gap-2 mt-4">
                          {currentCard.hint && !showHint && (
                            <button onClick={() => setShowHint(true)} className="text-xs text-gray-400 underline py-1">Show Hint</button>
                          )}
                        </div>
                      )}
                    </div>

                    {/* RATING CONTROLS */}
                    <div className="mt-4">
                      {!showAnswer ? (
                        <button 
                          onClick={() => setShowAnswer(true)} 
                          className="w-full py-4 rounded-xl font-semibold bg-gradient-to-r from-cyan-500 to-blue-600 text-black shadow-lg active:scale-95 transition-all text-sm tracking-wide">
                          REVEAL SOLUTION
                        </button>
                      ) : (
                        <div className="grid grid-cols-4 gap-2">
                          <button onClick={() => handleGrade(1)} className="flex flex-col py-3 bg-red-950/40 border border-red-800 text-red-400 rounded-xl text-center active:scale-95">
                            <span className="text-xs font-bold">Again</span>
                            <span className="text-[10px] opacity-70 mt-0.5">&lt;10m</span>
                          </button>
                          <button onClick={() => handleGrade(2)} className="flex flex-col py-3 bg-amber-950/40 border border-amber-800 text-amber-400 rounded-xl text-center active:scale-95">
                            <span className="text-xs font-bold">Hard</span>
                            <span className="text-[10px] opacity-70 mt-0.5">1.2d</span>
                          </button>
                          <button onClick={() => handleGrade(3)} className="flex flex-col py-3 bg-emerald-950/40 border border-emerald-800 text-emerald-400 rounded-xl text-center active:scale-95">
                            <span className="text-xs font-bold">Good</span>
                            <span className="text-[10px] opacity-70 mt-0.5">3.5d</span>
                          </button>
                          <button onClick={() => handleGrade(4)} className="flex flex-col py-3 bg-cyan-950/40 border border-cyan-800 text-cyan-400 rounded-xl text-center active:scale-95">
                            <span className="text-xs font-bold">Easy</span>
                            <span className="text-[10px] opacity-70 mt-0.5">8.0d</span>
                          </button>
                        </div>
                      )}
                    </div>
                  </div>
                ) : (
                  <div className="card-glass p-8 rounded-2xl text-center my-auto border border-gray-800">
                    <div className="text-3xl mb-2">🎉</div>
                    <h3 className="text-lg font-bold text-white">Review Queue Clear</h3>
                    <p className="text-xs text-gray-400 mt-1">All memories consolidated for today according to FSRS-5 parameters.</p>
                    <button onClick={() => setActiveTab("ai")} className="mt-4 px-4 py-2 bg-cyan-500 text-black rounded-lg text-xs font-semibold">
                      + Ingest New Material
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* TAB 2: PREDICTIVE TEMPORAL CALENDAR */}
            {activeTab === "calendar" && (
              <div className="space-y-4">
                <div className="card-glass p-4 rounded-xl border border-gray-800">
                  <h3 className="text-sm font-semibold text-white mb-1">7-Day Workload Forecast</h3>
                  <p className="text-xs text-gray-400 mb-4">FSRS projected memory decay schedule</p>
                  <div className="grid grid-cols-7 gap-1.5 text-center">
                    {calendarData.map((d, i) => (
                      <div key={i} className={`p-2 rounded-lg border ${i === 0 ? "bg-cyan-950/40 border-cyan-800 text-cyan-400" : "bg-gray-900 border-gray-800 text-gray-300"}`}>
                        <div className="text-[10px] font-mono">{d.name}</div>
                        <div className="text-sm font-bold mt-1">{d.count}</div>
                        <div className="text-[9px] text-gray-500 mt-0.5">{d.minutes}m</div>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="card-glass p-4 rounded-xl border border-gray-800">
                  <h4 className="text-xs font-semibold text-cyan-400 uppercase tracking-wider mb-2">Cognitive Simulation</h4>
                  <div className="bg-black/40 p-3 rounded-lg border border-gray-800 text-xs space-y-1.5">
                    <div className="flex justify-between">
                      <span className="text-gray-400">Total Cards Active:</span>
                      <span className="font-mono text-white">{cards.length}</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-gray-400">Target Retention:</span>
                      <span className="font-mono text-emerald-400">90%</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-gray-400">Est. 5-Day Inactivity Decay:</span>
                      <span className="font-mono text-red-400">-14.2%</span>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 3: AI CARD GENERATION */}
            {activeTab === "ai" && (
              <div className="card-glass p-5 rounded-2xl border border-gray-800 space-y-4">
                <h3 className="text-sm font-semibold text-white">AI Multi-Modal Ingest</h3>
                <p className="text-xs text-gray-400">Paste study text, lecture transcripts, or notes to auto-extract atomic active-recall cards.</p>
                <div className="flex gap-2">
                  <button onClick={() => setAiProvider("openai")} className={`flex-1 py-1.5 rounded-lg text-xs font-semibold border ${aiProvider === "openai" ? "bg-cyan-950 border-cyan-800 text-cyan-400" : "bg-gray-900 border-gray-800 text-gray-400"}`}>
                    OpenAI / Groq
                  </button>
                  <button onClick={() => setAiProvider("gemini")} className={`flex-1 py-1.5 rounded-lg text-xs font-semibold border ${aiProvider === "gemini" ? "bg-cyan-950 border-cyan-800 text-cyan-400" : "bg-gray-900 border-gray-800 text-gray-400"}`}>
                    Google Gemini
                  </button>
                </div>
                <textarea 
                  rows="6"
                  value={inputText}
                  onChange={(e) => setInputText(e.target.value)}
                  placeholder="Paste textbook excerpts, definitions, or equations here..."
                  className="w-full bg-black/50 border border-gray-800 rounded-xl p-3 text-sm text-gray-200 placeholder-gray-600 focus:outline-none focus:border-cyan-600"
                />
                <button 
                  onClick={generateCardsFromAI}
                  disabled={isGenerating}
                  className="w-full py-3 bg-cyan-500 text-black font-semibold rounded-xl text-xs active:scale-95 transition-all">
                  {isGenerating ? "PROCESSING VIA LLM..." : "EXTRACT FSRS CARDS"}
                </button>
              </div>
            )}

            {/* TAB 4: API VAULT SETTINGS */}
            {activeTab === "keys" && (
              <div className="card-glass p-5 rounded-2xl border border-gray-800 space-y-4">
                <div>
                  <h3 className="text-sm font-semibold text-white">Encrypted BYOK Vault</h3>
                  <p className="text-xs text-gray-400">Keys stored strictly in your iPhone's local sandbox storage.</p>
                </div>
                <div className="space-y-3">
                  <div>
                    <label className="text-[11px] text-gray-400 block mb-1">OpenAI / Groq API Key</label>
                    <input 
                      type="password"
                      value={keys.openai}
                      onChange={(e) => setKeys({ ...keys, openai: e.target.value })}
                      placeholder="sk-..."
                      className="w-full bg-black/50 border border-gray-800 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-cyan-600"
                    />
                  </div>
                  <div>
                    <label className="text-[11px] text-gray-400 block mb-1">Google Gemini API Key</label>
                    <input 
                      type="password"
                      value={keys.gemini}
                      onChange={(e) => setKeys({ ...keys, gemini: e.target.value })}
                      placeholder="AIzaSy..."
                      className="w-full bg-black/50 border border-gray-800 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-cyan-600"
                    />
                  </div>
                </div>
                <div className="p-3 bg-cyan-950/20 border border-cyan-800/40 rounded-xl text-[11px] text-cyan-300/80">
                  ✓ Direct client-to-API architecture. No proxy servers, zero monthly subscriptions.
                </div>
              </div>
            )}
          </div>

          {/* IPHONE BOTTOM DOCK / NAVIGATION */}
          <div className="grid grid-cols-4 gap-1 p-1.5 bg-[#12151E]/90 border border-gray-800/80 rounded-2xl backdrop-blur-xl">
            <button 
              onClick={() => setActiveTab("review")}
              className={`py-2 rounded-xl text-xs font-medium transition-all ${activeTab === "review" ? "bg-cyan-500 text-black font-semibold shadow" : "text-gray-400"}`}>
              Study
            </button>
            <button 
              onClick={() => setActiveTab("calendar")}
              className={`py-2 rounded-xl text-xs font-medium transition-all ${activeTab === "calendar" ? "bg-cyan-500 text-black font-semibold shadow" : "text-gray-400"}`}>
              Forecast
            </button>
            <button 
              onClick={() => setActiveTab("ai")}
              className={`py-2 rounded-xl text-xs font-medium transition-all ${activeTab === "ai" ? "bg-cyan-500 text-black font-semibold shadow" : "text-gray-400"}`}>
              AI Ingest
            </button>
            <button 
              onClick={() => setActiveTab("keys")}
              className={`py-2 rounded-xl text-xs font-medium transition-all ${activeTab === "keys" ? "bg-cyan-500 text-black font-semibold shadow" : "text-gray-400"}`}>
              Vault
            </button>
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
